# bottles/<name>.yml — one bottle = one container. The assembly is a config.
#
#   cp bottles/TEMPLATE.yml bottles/personal-site.yml   # filename = container name
#   vim bottles/personal-site.yml
#   ./up.sh personal-site                                     # idempotent — rerun after edits
#
# Everything here is secret-free and committable. Secret VALUES live in
# secrets.env (default ./.djinn/secrets.env) and are referenced by naming convention (below).
# Derived state (keys/, the container, generated configs) is disposable:
# up.sh rebuilds all of it from this file + secrets.env.

task: coding                       # label: coding | research | ... (informational)
#repos:                            # each → /workspace/repos/<name>; omit/empty →
#                                  # git init at /workspace/repos/scratch
#  - https://github.com/org/app.git                # name = URL basename
#  - {name: lib, url: https://github.com/org/lib.git}
forge: github                      # github | gitea

git:
  name: ""                         # blank = your host git config
  email: ""
  # token: (optional) the secrets.env VAR NAME holding this container's default
  # git credential. Absent → the global GH_TOKEN (shared machine user). Set it
  # to give the container its own identity token. up.sh HARD-FAILS if the named
  # var isn't set in secrets.env (never a silent fall-back to the wrong token).
  #   token: GH_TOKEN_fry
  # orgs: (optional) per-owner credential + identity overrides, keyed by forge
  # org/user name. A repo owned by <owner> authenticates with GH_TOKEN_<owner>
  # (routed by git-credential-org) and, if name/email are given, commits under
  # that identity. Single-org containers need no orgs: — git.token covers them.
  #   orgs:
  #     planetexpress:
  #       token: GH_TOKEN_planetexpress   # secrets.env var name (required per org)
  #       name:  "Leela Bot"              # optional — repo-local user.name for planetexpress/*
  #       email: "bot@planetexpress.example"  # optional — repo-local user.email

memory: 10g

# Optional — remote access. Every bottle is jump-reachable by default: sshd
# listens on the bridge :22 and the firewall accepts it only from the jump
# container (./djinn jump start; JUMP_AUTHORIZED_KEY in secrets.env). Phone
# flow: mosh coder@<jump ip>, then ssh djinn-<bottle>. Nothing to write here
# for that — a normal bottle omits the whole section. The keys below are the
# opt-outs (the mosh/notify extras — which need ssh: below — are shown after
# the #ssh: block further down):
#   jump: false      not reachable from the jump (no sshd unless ssh: is set)
#   shell: bash      interactive ssh/mosh/editor terminals land in plain bash
#                    instead of a fresh tmux session with the picker (tmux is
#                    the default; remote.tmux: true is a deprecated alias)
#remote:
#  jump: false
#  shell: bash

# Optional — direct access from the Docker host (VS Code Remote-SSH, or a
# Linux server/VPS you reach over your WireGuard/VPN tunnel): additionally
# publishes sshd on the host at this port. Requires SSH_AUTHORIZED_KEY (your
# public key) in secrets.env; on this path the firewall accepts :22 from the
# whole bridge, so direct ssh/mosh to the bottle's bridge IP works too. Host
# ports are exclusive — give each bottle its own. Keep bind at 127.0.0.1 and
# front it with your tunnel — never expose sshd to the open internet.
#ssh:
#  port: 2222
#  bind: 127.0.0.1

# Optional — mosh + idle notify extras, both riding the ssh: block above (a
# manifest has ONE remote: map — if you want these together with the jump
# opt-outs above, merge the keys into a single remote: block; as written,
# this block is valid paired with ssh: alone):
#   mosh: true       publish a per-bottle mosh UDP range NEXT TO ssh.port
#                    (requires ssh: above; the jump already carries mosh, so
#                    most bottles never need this). mosh_ports (START:END,
#                    default 60000:60010) must be disjoint per bottle — host
#                    UDP ports are exclusive, like ssh.port.
#   notify: ntfy     push to your ntfy topic when a tmux session goes idle at
#                    a prompt with nobody attached. Requires shell: tmux (the
#                    default — omit shell: here) and NTFY_URL (+ optional
#                    NTFY_TOPIC) in secrets.env; the ntfy host is auto-added
#                    to this bottle's egress allowlist (a self-hosted ntfy on
#                    a plain LAN hostname needs its IP in
#                    capabilities.egress_cidrs instead — the domain allowlist
#                    is DNS-driven; an IP-literal NTFY_URL is handled).
#remote:
#  mosh: true
#  mosh_ports: 60000:60010
#  notify: ntfy

# Agent CLIs baked into the image. Names are exact agents/<dir> matches.
# Omit this key entirely to enable every descriptor under agents/.
agents: [claude, aider]

# Firewall egress. Extra outbound the base allowlist doesn't already cover.
capabilities:
  egress: []                       # extra allowed outbound domains, e.g. [api.stripe.com]
  egress_cidrs: []                 # IP-range escape hatch, e.g. LAN subnets:
                                   #   [192.168.35.0/24, 192.168.20.0/24]
# (The gateway/proxyman/browser flags that used to live here are DEPRECATED —
#  they are plugins now. `capabilities: {gateway: true}` still works for one
#  release but prints a warning; prefer `plugins: [gateway]` below.)

# Plugins — every MCP server a container can get is a plugins/<name>/ directory.
# Listing a name here wires it into this container; unlisted plugins stay dormant
# in the shared image. LOCAL plugins run stdio inside the container (baked, wired
# into every agent); REMOTE plugins are HTTP servers, some backed by a Mac-side
# service you start once with ./service.sh <name>. See plugins/README.md for the
# schema, and each plugins/<name>/README.md for what a plugin does + its token.
#
#   plugins: [serena, gateway, obsidian-annotated]   # serena: local; others remote
plugins: []

# Optional egress plugin — agent-facing request/check MCP tools plus the
# request-egress CLI. Core interception and ./djinn allow work without this;
# enable when agents need explicit pre-flight tools (especially codex, which
# takes no remote MCP servers).
#   plugins: [egress]

# Per-container host port for a host-service plugin (optional). Host ports are
# exclusive, so two containers running the same plugin need different values —
# same reason each container has its own ssh.port / remote.mosh_ports. Overrides
# the plugin's default host_port in plugin.yml and re-points any ${HOST_PORT} in
# the plugin's remote url or local bridge command/args; the resolved port also
# feeds the firewall grant.
# Keep a browser bridge port BELOW 9222: the launcher derives that container's
# Chrome debug port as bridge+408, so a bridge at or above 9222 could collide
# with another container's debug port.
#   plugin_ports:
#     browser: 8815              # default in plugins/browser/plugin.yml is 8814

# Common plugin-secret defaults. Declaring a plugin slot here supplies one source
# value to every enabled agent; a required MCP is wired only where that slot
# resolves. Use the map form to re-point THIS container's slot at a different
# secrets.env variable.
#   common_secrets:
#     SLOT: SOURCE_VAR        # map form: source SLOT from SOURCE_VAR (re-point)
#     - SLOT                  # list form: source SLOT from same-named variable
# up.sh warns (does not fail) if a common source is missing; it produces no
# binding or MCP config for that slot until the source is set.
#
# Example (two containers, one gateway plugin, different tokens):
#   plugins: [gateway]
#   common_secrets: {MCP_GATEWAY_TOKEN: MCP_GATEWAY_TOKEN}      # this container
#   # …another container.yml…
#   common_secrets: {MCP_GATEWAY_TOKEN: MCP_GATEWAY_TOKEN_prod} # points elsewhere
common_secrets: {}

# Per-agent secret overrides or removals. A record replaces the common default
# for one agent, or `disabled: true` removes the slot for that agent. up.sh
# HARD-FAILS when an override source is absent or the agent/slot is unknown.
# See each plugins/<name>/README.md for slot names.
#
# Example: override one agent's shared gateway token and remove gateway for pi:
#   plugins: [gateway, obsidian-annotated, annotated-watch]
#   common_secrets: [MCP_GATEWAY_TOKEN]
#   agent_secrets:
#     - {agent: cursor-agent, slot: MCP_GATEWAY_TOKEN, secret: CURSOR_GATEWAY_TOKEN}
#     - {agent: pi,           slot: MCP_GATEWAY_TOKEN, disabled: true}
#     - {agent: claude, slot: OBSIDIAN_ANNOTATED_KEY, secret: OBSIDIAN_KEY_site_claude}
#     - {agent: cursor-agent, slot: OBSIDIAN_ANNOTATED_KEY, secret: OBSIDIAN_KEY_site_cursor}
#     - {agent: claude, slot: ANNOTATED_WATCH_KEY,    secret: OBSIDIAN_WATCH_KEY_site_claude}
# `disabled: true` omits both the secret and every MCP server that requires it.
# (the secret: values are var names in secrets.env; see secrets.env.example)
#
# (The old `identities: {obsidian: [...], watch: [...]}` ref-suffix form still
#  works for one release but prints a deprecation warning — prefer agent_secrets.)
agent_secrets: []
