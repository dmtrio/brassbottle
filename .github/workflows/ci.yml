# Staged copy of .github/workflows/ci.yml — the agent token lacks the
# `workflow` scope, so a human moves this file into .github/workflows/ and a
# follow-up commit removes this staged copy.
#
# This revision builds the shared image with the playwright plugin enabled
# (--build-arg PLUGINS_ENABLED=playwright) and asserts the MCP server, the
# tool-allowlist filter and Chromium are present in it. Everything else is
# unchanged from the current workflow.
# Adds one step, "Mosh lab", after the bottle entry-point check; the step is
# self-contained.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/ui/package-lock.json
      - name: Admin UI install, lint, token check, unit tests and build
        working-directory: admin/ui
        run: |
          npm ci
          npm run lint
          npm run test:tokens
          npm run test:unit
          npm run build
      - name: Run test suite
        # jq and python3 are preinstalled on ubuntu-latest; the suite
        # hard-skips (exit 0) only when yq/jq are missing, so installing yq
        # above keeps it honest.
        run: tests/plugins.test.sh
      - name: Remote-access contract checks
        # Static grep/lint assertions over the tmux landing, GC, notifier and
        # jump wiring (tests/remote.test.sh) — previously never run by CI.
        run: bash tests/remote.test.sh
      - name: Jump picker unit tests
        run: python3 -m unittest tests.test_jump_config tests.test_jump_registry tests.test_jump_picker tests.test_jump_host -v
      - name: Landing-GC unit tests
        run: python3 -m unittest tests.test_tmux_landing_gc -v
      - name: Admin contract tests
        # The broker's queue_snapshot() and /decide bodies are validated against
        # admin/contract/*.schema.json; a field added, removed or renamed on
        # either side without updating the schema fails here.
        run: python3 -m unittest tests.test_admin_contract tests.test_admin_contract_validator -v
      - name: Image builds
        # "If it ships, CI builds it": the shared image is the artifact
        # every container runs, so a PR that breaks the Dockerfile must fail.
        run: docker build --build-arg PLUGINS_ENABLED=playwright -t djinn-ci-smoke .
      - name: Playwright plugin is baked into the image
        # The build above bakes the playwright plugin (PLUGINS_ENABLED is
        # empty by default, so without the build-arg no plugin installs). A
        # green build with a missing server, browser or filter would still be
        # a broken plugin: assert each one is there, and print the sizes.
        run: |
          docker run --rm --user coder --entrypoint bash djinn-ci-smoke -lc '
            set -e
            playwright-mcp --version
            test -f /opt/plugins/playwright/mcp_filter.py
            ls "$HOME"/.cache/ms-playwright | grep -q chromium
            du -sh "$HOME/.cache/ms-playwright" "$(npm root -g)/@playwright"
          '
      - name: Backup image builds
        run: docker build -f backup/Dockerfile -t djinn-backup-ci-smoke .
      - name: Jump image builds
        # Same rule as the bottle and backup images: the jump container is
        # something the operator actually runs, so a PR that breaks its
        # Dockerfile must fail here rather than at 2am on a phone.
        run: docker build -f jump/Dockerfile -t djinn-jump-ci-smoke .
      - name: Jump entry point exists and mosh is installed
        # A green build with a missing entrypoint is still a broken jump.
        # mosh-server is checked too: it is the entire reason this image
        # exists, and apt silently succeeding with a renamed package would
        # otherwise only show up when a phone cannot connect.
        run: |
          docker run --rm --entrypoint test djinn-jump-ci-smoke -x /usr/local/bin/jump-entrypoint.sh
          docker run --rm --entrypoint test djinn-jump-ci-smoke -x /usr/local/bin/mosh-server
          docker run --rm --entrypoint /usr/bin/mosh-server djinn-jump-ci-smoke --version
      - name: Pull pinned Backrest image
        run: docker pull ghcr.io/garethgeorge/backrest:v1.14.1
      - name: Pull pinned tunnel image
        # Same guard as the Backrest pull: the connector ships as an upstream
        # image, so
        # nothing else in CI would notice a tag that does not exist. Without
        # this, a bad pin is discovered on the Mac at the moment remote access
        # is wanted.
        run: docker pull fosrl/newt:1.16.0
      - name: Backup integration smoke
        env:
          DJINN_BACKUP_CI_IMAGE: djinn-backup-ci-smoke
        run: python3 -m unittest tests.test_backup_integration -v
      - name: Entry point exists
        # A green build with a missing/renamed entrypoint is still a broken
        # container — assert the declared ENTRYPOINT file is present and
        # executable inside the built image.
        run: docker run --rm --entrypoint test djinn-ci-smoke -x /home/coder/entrypoint.sh
      - name: Mosh lab (client container to bottle)
        # Starts the built bottle image and the built jump image (the mosh
        # client) on one throwaway network and completes a mosh session that
        # prints a marker as coder. Skips without both image tags, so the
        # plain discovery run in the suite step never builds an image itself.
        env:
          DJINN_BOTTLE_CI_IMAGE: djinn-ci-smoke
          DJINN_JUMP_CI_IMAGE: djinn-jump-ci-smoke
        run: python3 -m unittest tests.test_mosh_lab -v
      - name: Egress image with admin UI
        # The egress image now builds the Vue admin SPA; assert the dist
        # directory and every hashed asset referenced from index.html land in
        # the image at the expected path.
        run: docker build -f egress/Dockerfile -t djinn-egress-ci-smoke .
      - name: Egress image admin dist entry point exists
        run: |
          docker run --rm --entrypoint test djinn-egress-ci-smoke -f /opt/brassbottle/admin/ui/dist/index.html
          docker run --rm -i --entrypoint python3 djinn-egress-ci-smoke - <<'PY'
          import re
          import sys
          from pathlib import Path
          html = Path('/opt/brassbottle/admin/ui/dist/index.html').read_text()
          refs = re.findall(r'/(assets/[^"\'\s>]+)', html)
          missing = [r for r in refs if not (Path('/opt/brassbottle/admin/ui/dist') / r).is_file()]
          # An index.html that references no assets is itself a broken build.
          if not refs or missing:
              print(f'asset refs={len(refs)} missing={missing}')
              sys.exit(1)
          print(f'assets ok: {len(refs)} referenced, all present')
          PY
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Admin shell Playwright test
        run: python3 tests/admin_spa_playwright.py
      - name: Admin behaviour suite
        run: python3 tests/admin_ui_playwright.py
