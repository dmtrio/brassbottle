# Staged copy of .github/workflows/ci.yml — the agent token lacks the
# `workflow` scope, so a human moves this file into .github/workflows/ and a
# follow-up commit removes this staged copy. Once live, the README's CI badge
# (see README badges) starts reporting.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run test suite
        # jq and python3 are preinstalled on ubuntu-latest; the suite
        # hard-skips (exit 0) only when yq/jq are missing, so installing yq
        # above keeps it honest.
        run: tests/plugins.test.sh
      - name: Image builds
        # "If it ships, CI builds it": the shared image is the artifact
        # every container runs, so a PR that breaks the Dockerfile must fail.
        run: docker build -t djinn-ci-smoke .
