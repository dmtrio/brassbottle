# herdr-config.toml — baked to /home/coder/.config/herdr/config.toml
# (Dockerfile). Minimal on purpose: keybindings/theme are upstream defaults
# (prefix ctrl+b, same as tmux). `herdr --default-config` prints every key.

# No first-run wizard: the landing execs straight into the workspace.
onboarding = false

[update]
# Bottle egress is default-deny and herdr.dev is not allowlisted, so both
# background checks would only ever fail. The version is pinned in the
# Dockerfile; bumping it is a rebuild, never `herdr update`.
version_check = false
manifest_check = false

[ui]
# Keep a mouse selection on screen until ctrl+c (or cmd+c when the host
# forwards it) copies it. The default copies on mouse-up and clears the
# highlight, and under VS Code's terminal that copy rides on OSC 52, which the
# host may drop: a drag then looks like it selected nothing.
copy_on_select = false
