# gateway — headless Playwright MCP gateway. A remote HTTP service on the Mac
# host, port 8811. Declared as the endpoint it is; the TRANSPORT is the wiring
# layer's business, not this file's. src/wire_plugins.py renders it per agent:
# natively for agents that can hold a ${VAR} in a remote header (claude, codex,
# kimi), and through an mcp-remote stdio shim for those that cannot
# (cursor-agent, pi). Neither branch writes the token to disk.
#
# Plaintext http:// to the Docker host is deliberate: the listener is
# localhost-only on the Mac, and the shim does not require TLS (verified with
# mcp-remote 0.1.49 — full initialize + tools/list over http://).
#
# The url dials ${HOST_PORT}, not a hardcoded 8811, so a manifest
# `plugin_ports: {gateway: N}` override moves the firewall grant and the
# endpoint together. See ./README.md.

host_port: 8811                        # firewall grant → HOST_MCP_PORTS, and ${HOST_PORT}

# A common default can be overridden or disabled for individual agents.
secrets:
  MCP_GATEWAY_TOKEN: {hint: "gateway (run ./service.sh gateway once)"}

mcp:
  coding:
    url: http://host.docker.internal:${HOST_PORT}/mcp
    headers: {Authorization: "Bearer ${MCP_GATEWAY_TOKEN}"}
    requires: [MCP_GATEWAY_TOKEN]
