# rhino-mcp — McNeel's OFFICIAL Rhino MCP Platform, reached directly over
# streamable HTTP. The Rhino-side plugin (yak: Rhino-MCP-Platform) hosts a
# Kestrel MCP server bound to the Mac's loopback (default port 10500); Docker
# Desktop proxies host.docker.internal connections onto the host loopback, so
# the container talks straight to the in-Rhino server and SKIPS McNeel's stdio
# "rhino-mcp-router", which is single-machine by design (stdio transport,
# hardcoded localhost dialing, no Linux build). The user starts the listener in
# Rhino with MCPStart and picks port 10500 — the default auto-increments per
# additional document, so pin it (see README). The endpoint has NO auth; the
# port-scoped firewall grant (HOST_MCP_PORTS) is the only gate. See ./README.md.

host_port: 10500

mcp:
  rhino-mcp:
    url: http://host.docker.internal:${HOST_PORT}/
