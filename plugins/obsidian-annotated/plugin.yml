# obsidian-annotated — the Annotated Obsidian MCP at mcp-obsidian.dmetr.io (a
# real internet host, reached via egress, so no host_port). Declared as the
# remote HTTP endpoint it is; the TRANSPORT is the wiring layer's business, not
# this file's. src/wire_plugins.py renders it per agent: natively for agents
# that can hold a ${VAR} in a remote header (claude, codex, kimi), and through
# an mcp-remote stdio shim for those that cannot (cursor-agent, pi). Neither
# branch writes the key to disk.
#
# requires: gates the server on an effective key, so exactly the agents bound in
# the manifest get it — and each connects with its OWN key, which matters here
# because Annotated attributes comment threads BY KEY:
#   agent_secrets:
#     - {agent: claude,       slot: OBSIDIAN_ANNOTATED_KEY, secret: OBSIDIAN_KEY_me_claude}
#     - {agent: cursor-agent, slot: OBSIDIAN_ANNOTATED_KEY, secret: OBSIDIAN_KEY_bot_cursor_agent}
#
# See ./README.md.

secrets:
  OBSIDIAN_ANNOTATED_KEY: {}

egress:
  - mcp-obsidian.dmetr.io

mcp:
  obsidian-annotated:
    url: https://mcp-obsidian.dmetr.io/mcp
    headers: {Authorization: "Bearer ${OBSIDIAN_ANNOTATED_KEY}"}
    requires: [OBSIDIAN_ANNOTATED_KEY]
