# axiom — Axiom's official MCP at mcp.axiom.co. Declared as the remote HTTP
# endpoint it is; the TRANSPORT is the wiring layer's business, not this file's.
# src/wire_plugins.py renders it per agent: natively for agents that can hold a
# ${VAR} in a remote header (claude, codex, kimi), and through an mcp-remote
# stdio shim for those that cannot (cursor-agent, pi). Either way the token is
# in NO MCP config file and never on a command line — the shim's argv holds the
# literal "${AXIOM_TOKEN}", which mcp-remote expands from the agent's own env at
# connect time. Axiom documents exactly this bridge for stdio-only clients.
#
# Hybrid secret resolution gates WHICH agents get axiom:
#   common_secrets: [AXIOM_TOKEN]               # shared default
#   agent_secrets:                              # per-agent override / disable
#     - {agent: cursor-agent, slot: AXIOM_TOKEN, secret: AXIOM_KEY_cursor}
#
# See ./README.md.

secrets:
  AXIOM_TOKEN: {hint: "axiom (an Axiom API token — Settings → API tokens; a scoped token 'xaat-…' is simplest)"}

egress:
  - mcp.axiom.co

mcp:
  axiom:
    url: https://mcp.axiom.co/mcp
    headers: {Authorization: "Bearer ${AXIOM_TOKEN}"}
    requires: [AXIOM_TOKEN]
