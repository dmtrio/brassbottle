# browser — watchable desktop browser the agent drives. Bridged to LOCAL stdio
# via `mcp-remote` so every agent (not just Claude) reaches the host HTTP
# service on 8814. mcp-remote (baked by install:) is a stdio↔HTTP proxy;
# ${RESEARCH_BROWSER_KEY} is substituted into the X-API-Key header at connect
# time from the agent shim env, not argv. See ./README.md.

host_port: 8814                        # firewall grant → HOST_MCP_PORTS

secrets:
  RESEARCH_BROWSER_KEY: {hint: "browser (run ./service.sh browser once)"}

install: |
  npm install -g 'mcp-remote@^0.1.38'

mcp:
  browser:
    command: mcp-remote
    args: ["http://host.docker.internal:${HOST_PORT}/mcp", "--header", "X-API-Key: ${RESEARCH_BROWSER_KEY}"]
    requires: [RESEARCH_BROWSER_KEY]
