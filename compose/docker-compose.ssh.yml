# docker-compose.ssh.yml — overlay added by up.sh when the manifest has an
# ssh: section. Publishes the container's sshd on the host: this is now
# purely "also reachable from the Mac" (VS Code Remote-SSH) — sshd itself,
# its keys, and the remote-access env are ALL on docker-compose.local.yml
# already (jump reachability is default-on), so this overlay only needs to
# open the host port and flip SSH_ENABLED so the entrypoint's explicit-ssh
# branch runs instead of the quiet-degrading jump one. Never public-facing by
# itself: bind defaults to 127.0.0.1; on a remote host set ssh.bind in the
# manifest deliberately (and front with your WireGuard/VPN tunnel — not the
# open internet).

services:
  djinn:
    ports:
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT}:22"
    environment:
      - SSH_ENABLED=true
