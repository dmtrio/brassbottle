# docker-compose.local.yml
# Template for a single local Agent dev container (RFC 03: Docker Desktop /
# plain Linux Engine, attach mode — no sshd, no macvlan).
# Launched via ./up.sh <name> — don't run directly.

services:
  djinn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: coder
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        # ${VAR-default}, NOT ${VAR:-default}: up.sh always sets this, possibly
        # to the EMPTY set (a manifest whose tools: enables no agent), and the
        # :- form would silently swap that explicit empty set for all agents.
        # up.sh always sets this from manifest.py; direct `docker compose` runs
        # must export AGENTS_ENABLED explicitly (unset defaults fail-closed).
        AGENTS_ENABLED: "${AGENTS_ENABLED-}"
        # ${VAR-default}, NOT ${VAR:-default}: up.sh always sets this, possibly
        # to the EMPTY set (a manifest whose plugins: enables none), and the
        # :- form would silently swap that explicit empty set for all plugins.
        # up.sh always sets this from manifest.py; direct `docker compose` runs
        # must export PLUGINS_ENABLED explicitly (unset defaults fail-closed).
        PLUGINS_ENABLED: "${PLUGINS_ENABLED-}"
    # Per-container tag: each container builds/uses its own image tag
    image: djinn:${IMAGE_TAG:-local}

    container_name: djinn-${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}

    labels:
      # Host-side jump_registry.py queries this label and writes a read-only
      # picker registry for the jump. The jump itself never receives Docker
      # socket access.
      djinn.remote.jump: "${REMOTE_JUMP:-true}"
      djinn.jump.scope: "${JUMP_REGISTRY_SCOPE}"

    restart: unless-stopped

    # Egress firewall (init-firewall.sh) needs these; entrypoint fails loud
    # if they're missing while ENABLE_FIREWALL=true (the default).
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # Docker Desktop provides host.docker.internal natively; this line makes
    # it work on plain Linux Engine too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - CONTAINER_NAME=${CONTAINER_NAME}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - TZ=${TZ:-America/Chicago}
      # Host MCP opt-in: comma-separated TCP ports on host.docker.internal.
      # Empty = container cannot reach the host at all.
      - HOST_MCP_PORTS=${HOST_MCP_PORTS:-}
      # Extra egress allowlist domains (comma-separated), per project.
      - EXTRA_ALLOWED_DOMAINS=${EXTRA_ALLOWED_DOMAINS:-}
      # CIDR escape hatch (comma-separated), e.g. LAN subnets.
      - ALLOWED_CIDRS=${ALLOWED_CIDRS:-}
      # Egress broker: NFLOG reader files blocked destinations with the host
      # daemon. Token is injected by up.sh (host-side read); visible here so
      # processes can file — approval remains host-side; per-bottle tokens
      # limit blast radius to this container only.
      - ENABLE_EGRESS_BROKER=${ENABLE_EGRESS_BROKER:-true}
      - EGRESS_BROKER_TOKEN=${EGRESS_BROKER_TOKEN:-}
      # MCP credentials are NOT container env — they load per agent at
      # process start from the mounted ~/.agent-keys dir (see volumes).

      # ── Remote access (PLN - default jump reachability) ───────────────────
      # Always present, on EVERY bottle — not just ssh:-enabled ones: sshd is
      # jump-reachable by default (remote.jump: false opts out), so the
      # entrypoint and firewall need these regardless of whether ssh: was
      # ever set. docker-compose.ssh.yml layers SSH_ENABLED=true + the host
      # port on top for the additional Mac-direct path.
      - REMOTE_JUMP=${REMOTE_JUMP:-true}
      - REMOTE_SHELL=${REMOTE_SHELL:-tmux}
      # The jump container's static bridge address (up.sh resolves it
      # host-side via `jump_host.py ip`, AFTER the shared network exists).
      # Empty until a jump address has ever been derived — init-firewall.sh
      # degrades to a warning, not a failure, in that case.
      - DJINN_JUMP_IP=${DJINN_JUMP_IP:-}
      # The operator's own key, plus the singleton jump container's key
      # (appended, never replacing — see entrypoint.sh). Both authorise sshd
      # regardless of which remote path started it.
      - SSH_AUTHORIZED_KEY=${SSH_AUTHORIZED_KEY:-}
      - JUMP_AUTHORIZED_KEY=${JUMP_AUTHORIZED_KEY:-}
      # RFC 04 notify: set only when the manifest has remote.notify: ntfy (up.sh
      # passes them through; empty otherwise). The tmux silence hook arms
      # itself off NTFY_URL's presence.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}

    volumes:
      # ── Project workspace: named volume, repo cloned inside ───────────────
      # (compose project name prefixes this, so each container gets its own)
      - workspace:/workspace

      # ── Artifacts outbox: survives container/volume destruction ───────────
      # Mac-browsable. For agent OUTPUTS that aren't code: screenshots,
      # reports, exports, progress notes. Code still exits via git only.
      - ${ARTIFACTS_PATH}:/artifacts
      # Browser file-exchange dir, nested inside the outbox on purpose: it is
      # the host TMPDIR the browser plugin's MCP is launched with, which is the
      # only directory that MCP is allowed to write to. Docker mounts by
      # destination depth, so /artifacts lands first and this over it (leaving
      # an empty browser/ in the outbox on the host).
      - ${BROWSER_TMP_PATH}:/artifacts/browser

      # ── Per-agent MCP credentials (edit host-side, live in container) ─────
      # <keys>/<agent>.env = one complete env file per agent: the shared
      # plugin tokens (gateway, bridges) plus that agent's own identity keys.
      # Loaded by the agent-identity shims at process start — changes apply
      # on next launch.
      - ${KEYS_PATH}:/home/coder/.agent-keys:ro

      # ── Shared knowledge, never shared identity ───────────────────────────
      # Global rules + skills, read-only: host is the single writer; agents
      # propose changes via PR to the rules repo (see AGENTS.md governance).
      - ${RULES_PATH}:/agent-rules:ro

      # Per-agent auth/state mounts are generated per container from
      # agents/*/agent.yml state_dirs into $BASE_PATH/compose/$NAME.agents.yml.
      # That descriptor-local source of truth includes cursor's two-dir nuance.
      - gh-auth:/home/coder/.config/gh

    # PID 1 must reap. The entrypoint is not an init: children that outlive
    # their parent (Xvfb/Electron helpers from print harnesses, language
    # servers from dead agent sessions) get reparented to PID 1 and, unreaped,
    # sit as <defunct> zombies until the container is recreated. `init: true`
    # injects tini as PID 1 (signal forwarding + orphan reaping); the
    # entrypoint is unchanged.
    init: true

    # Memory cap comes from the capability profile (coding needs headroom
    # for builds/tests; default stays lean)
    mem_limit: ${MEM_LIMIT:-2g}
    memswap_limit: ${MEM_LIMIT:-2g}

volumes:
  workspace:
  gh-auth:

# Shared bridge (RFC 04): every djinn container joins ONE user-defined
# network with a stable subnet instead of a per-project default network, so
# a WireGuard/VPN layer on the host can target the whole fleet as a single
# CIDR and reach any container. up.sh creates it if missing (external: true
# keeps compose from making per-project copies). Containers on it can see
# each other at L3 — accepted under the single-operator trust model; each
# container's egress firewall still governs its own traffic.
networks:
  default:
    name: djinn-net
    external: true
