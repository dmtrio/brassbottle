# pi — Earendil's pi coding agent. pi ships an interactive installer
# (pi.dev/install.sh) that just wraps this npm package — install it directly
# for non-TTY builds.
#
# MCP: pi has no built-in MCP client. djinn wires every enabled plugin's
# servers into ~/.pi/agent/mcp.json (same mcpServers shape as Claude's
# .mcp.json); the upstream pi-mcp-adapter package is the consumer — it reads
# that file natively (Pi-global override in its merge chain), expands ${VAR}
# refs from the process env, and exposes servers lazily through one proxy
# `mcp` tool (~200 tokens instead of every server's full tool surface).
# Pinned versioned spec: pi skips pinned npm packages on `pi update`, so the
# image build decides the version; bump it here deliberately.
# See ./README.md.

# Global rules: pi loads AGENTS.md from its agent dir (~/.pi/agent) as the
# global context file, then walks the cwd's ancestors for project files
# (loadContextFileFromDir(agentDir) in the pi package). Declaring it here puts
# pi on compose_rules' target list, so it receives the same composed rules as
# claude and codex instead of receiving no global rules at all.
rules_file: .pi/agent/AGENTS.md
binary: pi

install: |
  npm install -g @earendil-works/pi-coding-agent
  # MCP bridge — makes the wired ~/.pi/agent/mcp.json live (see ./README.md).
  # Versioned spec = pinned: pi skips it on package updates, so the version
  # changes only when this line does. Writes the pin into
  # ~/.pi/agent/settings.json and installs under ~/.pi/agent/npm/. Build
  # runs as coder, so $HOME needs no chown.
  pi install npm:pi-mcp-adapter@2.32.1

mcp:
  config_path: .pi/agent/mcp.json
  format: json
  dialect: type-http
  env_refs: false
