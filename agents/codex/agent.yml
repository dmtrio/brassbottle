# codex — OpenAI Codex CLI (npm @openai/codex).
# MCP wiring is a prefix-marked managed block in ~/.codex/config.toml
# (codex_managed_block strategy owns the rendering, so no dialect is
# declared). Remote-header secrets are warn-only today: codex gets local
# (stdio) servers; an agent-scoped remote logs a warning instead of baking
# a literal key.

binary: codex

install: |
  npm install -g @openai/codex

state_dirs:
  - {path: .codex, volume: codex-auth}

rules_file: .codex/AGENTS.md

mcp:
  config_path: .codex/config.toml
  format: toml
  env_refs: false
  strategy: codex_managed_block

# Top-level keys stamped into ~/.codex/config.toml as a managed head block.
# The container is the enforcing boundary here — one codex cannot see, and one
# its own seccomp/landlock layer mostly duplicates at the cost of breaking
# ordinary work (writes outside the cwd, the egress-firewalled network it is
# explicitly allowed to reach).
#
# ACCEPTED TRADEOFF, stated so the next reader does not re-derive it: the
# duplication is not total. /artifacts is bind-mounted to the user's Mac, so
# dropping codex's own workspace-write restriction lets an unattended run
# overwrite or delete files on the HOST there. That is the same reach every
# other agent in the bottle already has, and /artifacts is an outbox by
# design; the alternative (workspace-write plus explicit writable roots) buys
# back only that one directory while re-breaking cross-worktree work.
# danger-full-access is therefore correct INSIDE a djinn bottle and nowhere
# else.
config_settings:
  sandbox_mode: danger-full-access
